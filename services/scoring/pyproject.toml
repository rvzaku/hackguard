[project]
name = "hackguard-scoring"
version = "0.1.0"
description = "HackGuard scoring sidecar: FastAPI + XGBoost/SHAP timing model (scaffold)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.3",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
    "datamodel-code-generator>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoring"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Generated code — regenerated by scripts/gen-pydantic.sh, never hand-edited.
extend-exclude = ["src/scoring/contracts_gen.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
# Generated from packages/contracts/openapi.json by scripts/gen-pydantic.sh.
# Excluded from full strict mode as standard practice for generated code:
# constrained-type annotations (constr/confloat) trip valid-type under strict.
module = "scoring.contracts_gen"
disable_error_code = ["valid-type"]
disallow_untyped_calls = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
